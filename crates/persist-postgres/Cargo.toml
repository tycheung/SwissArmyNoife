[package]
name = "persist-postgres"
description = "SwissArmyNoife Postgres persistence (pool + migrations behind postgres feature)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Real connection pool + migrations (sak070).
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres", "dep:tokio"]

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true, default-features = false, features = ["rt_tokio_1"] }

[lints]
workspace = true
