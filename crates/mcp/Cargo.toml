[package]
name = "mcp"
description = "SwissArmyNoife MCP server (stdio + Streamable HTTP)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mcp"
path = "src/lib.rs"

[[bin]]
name = "mcp"
path = "src/main.rs"

[[bin]]
name = "mcp-http"
path = "src/http_main.rs"

[dependencies]
rmcp = { version = "0.12", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }
axum = "0.8"
http = "1"
tokio-util = "0.7"
control = { path = "../control" }
env = { path = "../env" }
offer-llm = { path = "../offer-llm" }
offer-sandbox = { path = "../offer-sandbox" }
offer-tools = { path = "../offer-tools" }
offer-egress = { path = "../offer-egress" }
offer-memory = { path = "../offer-memory" }
offer-research = { path = "../offer-research" }
offer-capacity = { path = "../offer-capacity" }
offer-compute = { path = "../offer-compute" }
offer-eval = { path = "../offer-eval" }
persist-sqlite = { path = "../persist-sqlite" }
vault = { path = "../vault" }
module-registry = { path = "../module-registry" }
provider-anthropic = { path = "../provider-anthropic" }
provider-core = { path = "../provider-core" }
provider-ollama = { path = "../provider-ollama" }
provider-openai = { path = "../provider-openai" }
types = { path = "../types" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "sync", "signal", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true }

[dev-dependencies]
rmcp = { version = "0.12", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process"] }
module-registry = { path = "../module-registry" }

[lints]
workspace = true
