name: ci

on:
  push:
    branches: [master, main]
  pull_request:

defaults:
  run:
    working-directory: .

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: boundaries
        run: cargo run -q -p xtask -- boundaries
      - name: conformance pack (sak529-b)
        run: cargo run -q -p xtask -- conformance
      - name: schema export --check (sak530-b)
        run: cargo run -q -p xtask -- schema export --check
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: licenses
        run: cargo deny check licenses
      - name: control coverage (optional, sak063-e)
        continue-on-error: true
        run: ./scripts/control_coverage.sh

  sdk-go:
    name: sdk-go (sak347-a)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: go test
        run: go test ./...

  sdk-java:
    name: sdk-java (sak347-a)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn test
        run: mvn -B -q test
